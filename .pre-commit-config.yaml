# See https://pre-commit.com for more information
# Install with: pip install pre-commit
# Setup: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']  # Allow custom tags in Docker Compose files
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending

  # Shell script validation
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        args: ['-x', '-S', 'warning']

  # Docker Compose validation
  - repo: local
    hooks:
      - id: docker-compose-check
        name: Validate Docker Compose files
        entry: bash -c 'docker compose -f docker-compose.yml config > /dev/null'
        language: system
        files: '(docker-compose|compose).*\.(yml|yaml)$'
        pass_filenames: false

  # Check for secrets in files
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        exclude: '\.example\.(env|yml|yaml)$'

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: ['--config', '.github/workflows/markdownlint-config.json']
